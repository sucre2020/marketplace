<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'products/css/style.css' %}">
</head>
<body>

    <p><small>Added on: {{ product.created_at }}</small></p>

</body>
</html>
